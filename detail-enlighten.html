<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="color-scheme" content="light">

  <title>Enlighten — Ali Mobarekati</title>
  <meta content="Enlighten is an upcoming flagship project by Ali Mobarekati. Details coming soon." name="description">
  <meta content="Enlighten, flagship, upcoming, Ali Mobarekati" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css?version=19" rel="stylesheet">
  <link href="assets/css/project-page.css?version=2" rel="stylesheet">

  <script>
    document.documentElement.classList.add('js');
  </script>
</head>

<body>

  <main id="main">
    <div class="rn">
      <div class="rn-shell">

        <!-- ============ Top bar ============ -->
        <nav class="rn-topbar" aria-label="Breadcrumb">
          <a class="rn-crumb" href="index.html#portfolio" data-close-detail>
            <i class="bi bi-arrow-left"></i> Portfolio
          </a>
          <span class="rn-sep" aria-hidden="true">/</span>
          <span class="rn-current">Enlighten</span>
          <span class="rn-topbar-spacer"></span>
          <ul class="rn-chips">
            <li><i class="bi bi-stars"></i> Flagship</li>
            <li><i class="bi bi-hourglass-split"></i> In progress</li>
          </ul>
        </nav>

        <!-- ============ Page header ============ -->
        <header class="rn-head">
          <div class="rn-head-icon">
            <img src="assets/img/portfolio/enl.jpg" alt="Enlighten">
          </div>
          <div class="rn-head-copy">
            <h1 class="rn-title">Enlighten</h1>
            <p class="rn-subtitle">An upcoming flagship project</p>
          </div>
        </header>

        <!-- ============ Detail: cover left, description right ============ -->
        <section class="rn-section rn-detail">
          <div class="rn-detail-media">
            <figure class="rn-frame">
              <div class="rn-frame-bar" aria-hidden="true">
                <span class="rn-dot"></span><span class="rn-dot"></span><span class="rn-dot"></span>
                <span class="rn-frame-title">Enlighten — teaser</span>
              </div>
              <img src="assets/img/portfolio/enl.jpg" alt="Enlighten">
            </figure>
          </div>

          <div class="rn-detail-body rn-reveal" style="--rn-delay:.1s">
            <div class="rn-panel">
              <span class="rn-eyebrow rn-panel-label"><i class="bi bi-journal-text"></i> Overview</span>

              <p class="rn-status"><i class="bi bi-hourglass-split"></i> Coming soon</p>

              <ul class="rn-meta" style="margin-top:18px">
                <li>
                  <span class="rn-meta-label">Category</span>
                  <span class="rn-meta-value">Coming soon</span>
                </li>
                <li>
                  <span class="rn-meta-label">Date</span>
                  <span class="rn-meta-value">To be announced</span>
                </li>
              </ul>

              <div class="rn-story">
                <p>
                  Enlighten is the project I'm putting the most into right now. Description and
                  further details are coming soon.
                </p>
              </div>
            </div>
          </div>
        </section>

        <!-- ============ Footer ============ -->
        <div class="rn-footer">
          <span>Ali Mobarekati</span>
        </div>

      </div>
    </div>
  </main>

  <script src="assets/js/project-page.js?version=2"></script>
